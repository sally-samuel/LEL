<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blog - Levene Energy Holdings</title>
  <meta name="description" content="Insights, updates and thought leadership from Levene Energy Holdings.">
  <meta property="og:title" content="Blog - Levene Energy Holdings">
  <meta property="og:description" content="Insights, updates and thought leadership from the energy sector.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="./image/levenelogo.png">
  <link rel="shortcut icon" href="./image/levene-energies.png" type="image/x-icon">

  <link rel="stylesheet" href="./css/blog.css">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>


<div id="header-placeholder"></div>

<script>
  fetch('header.html')
    .then(r => {
      if (!r.ok) throw new Error('Header not found');
      return r.text();
    })
    .then(html => {
      document.getElementById('header-placeholder').innerHTML = html;
    })
    .catch(err => {
      console.error('Failed to load header:', err);
    });
</script>

<!-- Page Hero -->
<section class="page-hero">
  <div class="page-hero-inner">
    <div class="section-label">Our BLOG</div>
    <h1>BLOG</h1>
    <p>Insights, updates and thought leadership from the energy sector</p>
    <div class="breadcrumb">
      <a href="index.html">Home</a><span>/</span><span>Blog</span>
    </div>
  </div>
</section>

<!-- Blog posts grid -->
<main class="posts-container" id="posts-container">
  <div class="loading">Loading latest insights...</div>
</main>
<div id="footer-placeholder"></div>

<script>
  fetch('footer.html')
    .then(r => r.text())
    .then(html => document.getElementById('footer-placeholder').innerHTML = html)
    .catch(err => console.error('Failed to load footer:', err));
</script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const hamburger = document.getElementById('hamburger');
  const navList   = document.getElementById('nav-list');
  const navClose  = document.getElementById('nav-close');

  if (hamburger && navList) {
    hamburger.addEventListener('click', e => {
      e.stopPropagation();
      navList.classList.add('open');
    });
  }

  if (navClose) {
    navClose.addEventListener('click', () => {
      navList.classList.remove('open');
      document.querySelectorAll('.nav-list .dropdown').forEach(d => d.classList.remove('mob-open'));
    });
  }

  document.querySelectorAll('.nav-list .dropdown > a').forEach(link => {
    link.addEventListener('click', e => {
      if (window.innerWidth > 768) return;
      e.preventDefault();
      e.stopPropagation();
      const dropdown = link.closest('.dropdown');
      const isOpen = dropdown.classList.contains('mob-open');
      document.querySelectorAll('.nav-list .dropdown').forEach(d => d.classList.remove('mob-open'));
      if (!isOpen) dropdown.classList.add('mob-open');
    });
  });
});
</script>


<script type="module">
  const PROJECT_ID  = 'ilajnehi';
  const DATASET     = 'production';
  const API_VERSION = 'v2025-06-01';

  const baseUrl = `https://${PROJECT_ID}.apicdn.sanity.io/${API_VERSION}/data/query/${DATASET}`;

  async function getPosts() {
    const query = `
      *[_type == "post" && defined(publishedAt)] 
      | order(publishedAt desc) [0...12] {
        _id,
        title,
        "slug": slug.current,
        excerpt,
        publishedAt,
        "imageUrl": mainImage.asset->url
      }
    `;

    const url = baseUrl + `?query=${encodeURIComponent(query)}`;

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Sanity responded with ${res.status}`);
      const json = await res.json();
      return { posts: json.result || [], error: null };
    } catch (err) {
      console.error('Failed to load posts:', err);
      return { posts: [], error: err.message };
    }
  }

  function formatDate(isoString) {
    if (!isoString) return 'Date not available';
    return new Date(isoString).toLocaleDateString('en-GB', {
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    });
  }

  function improveImageUrl(url, width = 800) {
    if (!url) return '';
    return `${url}?w=${width}&auto=format&fit=crop&q=82`;
  }

  function esc(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  async function renderPosts() {
    const container = document.getElementById('posts-container');

    const { posts, error } = await getPosts();

    if (error) {
      container.innerHTML = `
        <div class="no-posts error">
          <h3>Failed to load posts</h3>
          <p>There was a problem connecting to the content server.</p>
          <p><small>Error: ${esc(error)}</small></p>
        </div>
      `;
      return;
    }

    if (posts.length === 0) {
      container.innerHTML = `
        <div class="no-posts">
          <h3>No blog posts found</h3>
          <p>There are currently no published articles.</p>
          <p>Check back later or <a href="index.html">return to homepage</a>.</p>
        </div>
      `;
      return;
    }

    container.innerHTML = posts.map(post => {
      const href = post.slug ? `post.html?slug=${esc(post.slug)}` : '#';
      return `
        <article class="post-card" onclick="location.href='${href}'" style="cursor:pointer">
          ${post.imageUrl ? `
            <img
              class="post-image"
              src="${improveImageUrl(post.imageUrl, 800)}"
              alt="${esc(post.title) || 'Blog post'}"
              loading="lazy"
            >
          ` : ''}

          <div class="post-content">
            <h2 class="post-title">${esc(post.title) || 'Untitled'}</h2>

            <div class="post-meta">
              ${post.publishedAt ? formatDate(post.publishedAt) : 'No date'}
            </div>

            ${post.excerpt ? `<p class="post-excerpt">${esc(post.excerpt)}</p>` : ''}

            ${post.slug ? `
              <a href="${href}" class="read-more" onclick="event.stopPropagation()">
                Read full article →
              </a>
            ` : ''}
          </div>
        </article>
      `;
    }).join('');
  }

  renderPosts();
</script>

</body>
</html>
